<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Ôn thi Toàn diện</title>
    <style>
        :root {
            --bg-color: #edf3f2;
            --container-bg: #fff;
            --text-color: #333;
            --text-secondary: #173f5f;
            --border-color: #d8e2e0;
            --ans-bg: #f3f7f6;
            --btn-secondary: #95a5a6;
            --btn-secondary-hover: #7f8c8d;
            --btn-shuffle: #f2a541;
            --btn-shuffle-hover: #db8c27;
            --accent: #167d7f;
            --accent-dark: #126466;
            --accent-soft: #e4f3ef;
            --panel-gradient: linear-gradient(120deg, #e4f3ef, #fff8e8);
            --panel-border: #d4e8df;
        }

        body.dark-mode {
            --bg-color: #0b1724;
            --container-bg: #122b39;
            --text-color: #e6f3f0;
            --text-secondary: #ffd166;
            --border-color: #315460;
            --ans-bg: #193d49;
            --btn-secondary: #41606a;
            --btn-secondary-hover: #527783;
            --accent: #55c2b5;
            --accent-dark: #3b9f96;
            --accent-soft: #173f47;
            --panel-gradient: linear-gradient(120deg, #153f44, #293548);
            --panel-border: #35666b;
        }

        body { font-family: "Trebuchet MS", Arial, sans-serif; background: linear-gradient(135deg, var(--bg-color), #dcebe8); color: var(--text-color); margin: 0; padding: 28px 20px; transition: background 0.3s, color 0.3s; }
        body.dark-mode { background: linear-gradient(135deg, #09131f, #12363f); }
        .container { max-width: 800px; margin: 0 auto; background: var(--container-bg); padding: 34px; border: 1px solid var(--panel-border); border-radius: 14px; box-shadow: 0 18px 45px rgba(23,63,95,0.12); transition: background-color 0.3s, box-shadow 0.3s; }
        body.dark-mode .container { box-shadow: 0 20px 55px rgba(0,0,0,0.3); }
        h1, h2 { color: var(--text-secondary); }
        h1 { margin: 0 0 6px; font-size: clamp(26px, 5vw, 38px); letter-spacing: 0; }
        h2 { font-size: 21px; line-height: 1.5; margin: 22px 0 14px; }
        .subtitle { color: var(--accent); margin: 0 0 24px; font-size: 14px; font-weight: bold; letter-spacing: 0.5px; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; }
        .home-link { color: var(--text-secondary); text-decoration: none; font-weight: bold; font-size: 14px; }
        .home-link:hover { text-decoration: underline; }
        #theme-toggle { background: transparent; border: 1px solid var(--text-color); color: var(--text-color); padding: 5px 10px; cursor: pointer; border-radius: 4px; font-size: 14px; }
        
        select#subject-select { background: var(--accent); color: white; padding: 11px 14px; border: none; border-radius: 8px; font-size: 14px; margin-bottom: 15px; cursor: pointer; outline: none; font-weight: bold; }
        select#subject-select option { background: white; color: #333; }
        
        #question { background: var(--accent-soft); border-left: 5px solid var(--accent); padding: 16px 18px; border-radius: 0 10px 10px 0; }
        textarea { width: 100%; height: 150px; padding: 16px; font-size: 16px; line-height: 1.5; border: 2px solid var(--border-color); border-radius: 10px; margin-bottom: 15px; resize: vertical; box-sizing: border-box; background-color: var(--container-bg); color: var(--text-color); transition: border-color 0.2s, box-shadow 0.2s; }
        textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(22,125,127,0.12); }
        button { background: var(--accent); color: white; border: none; padding: 11px 18px; font-size: 15px; cursor: pointer; border-radius: 8px; margin-right: 10px; margin-bottom: 10px; transition: transform 0.2s, background 0.2s, box-shadow 0.2s; }
        button:hover { background: var(--accent-dark); transform: translateY(-1px); box-shadow: 0 5px 12px rgba(22,125,127,0.2); }
        
        .btn-secondary { background: var(--btn-secondary); }
        .btn-secondary:hover { background: var(--btn-secondary-hover); }
        .btn-shuffle { background: var(--btn-shuffle); }
        .btn-shuffle:hover { background: var(--btn-shuffle-hover); }
        
        #feedback { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; }
        .correct { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .incorrect { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .dark-mode .correct { background: #1b4332; border: 1px solid #2d6a4f; color: #d8f3dc; }
        .dark-mode .incorrect { background: #5c1a1b; border: 1px solid #85181a; color: #f8d7da; }
        
        .missing-word { color: red; font-weight: bold; text-decoration: underline; }
        .dark-mode .missing-word { color: #ff6b6b; }
        
        #original-answer { margin-top: 15px; background: var(--ans-bg); padding: 18px; border-radius: 10px; display: none; white-space: pre-line; line-height: 1.55; border: 1px solid var(--border-color); }
        
        #shuffle-notification { color: #2ecc71; font-weight: bold; margin-left: 10px; display: none; font-size: 14px; }
        .memory-panel { background: var(--panel-gradient); padding: 18px; border-radius: 12px; margin: 15px 0; border: 1px solid var(--panel-border); box-shadow: 0 8px 18px rgba(22,125,127,0.08); }
        .memory-panel > strong { color: var(--text-secondary); font-size: 17px; }
        .memory-stats { display: flex; gap: 20px; flex-wrap: wrap; margin: 8px 0 12px; font-size: 14px; }
        .memory-stats strong { color: var(--text-secondary); font-size: 18px; }
        .memory-actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .memory-actions button { margin: 0; font-size: 14px; padding: 8px 12px; }
        #recall-panel { display: none; border-top: 1px solid var(--border-color); margin-top: 15px; padding-top: 12px; }
        #recall-panel p { margin: 0 0 10px; font-weight: bold; }
        .btn-forgot { background: #c0392b; }
        .btn-hard { background: #d68910; }
        .btn-remembered { background: #218c74; }
        .memory-tip { font-size: 13px; margin: 10px 0 0; opacity: 0.85; }
        .dark-mode .memory-panel,
        .dark-mode .memory-panel p,
        .dark-mode .memory-panel span { color: var(--text-color); }
        .dark-mode .memory-panel > strong,
        .dark-mode .memory-stats strong { color: var(--text-secondary); }
        .dark-mode #question { color: var(--text-color); }
        .dark-mode .correct { color: #d8f3dc; }
        .dark-mode .incorrect { color: #ffd9d9; }
        .question-label { color: var(--accent); text-transform: uppercase; font-size: 12px; font-weight: bold; letter-spacing: 1px; }
        mark {
            background: rgba(255, 209, 102, 0.45);
            color: inherit;
            border-radius: 4px;
            padding: 1px 4px;
            box-shadow: inset 0 -1px 0 rgba(0,0,0,0.08);
        }
        .dark-mode mark {
            background: rgba(255, 209, 102, 0.2);
            color: #fff3c4;
        }
        .keyword-hl-1 { background: rgba(255, 122, 122, 0.35); }
        .keyword-hl-2 { background: rgba(90, 180, 255, 0.35); }
        .keyword-hl-3 { background: rgba(122, 212, 142, 0.35); }
        .keyword-hl-4 { background: rgba(255, 191, 92, 0.42); }
        .keyword-hl-5 { background: rgba(184, 134, 255, 0.35); }
        .keyword-hl-6 { background: rgba(255, 138, 214, 0.35); }
        .dark-mode .keyword-hl-1 { background: rgba(255, 122, 122, 0.24); }
        .dark-mode .keyword-hl-2 { background: rgba(90, 180, 255, 0.24); }
        .dark-mode .keyword-hl-3 { background: rgba(122, 212, 142, 0.24); }
        .dark-mode .keyword-hl-4 { background: rgba(255, 191, 92, 0.26); }
        .dark-mode .keyword-hl-5 { background: rgba(184, 134, 255, 0.24); }
        .dark-mode .keyword-hl-6 { background: rgba(255, 138, 214, 0.24); }
        .keyword-priority-core { background: rgba(255, 209, 102, 0.55); }
        .keyword-priority-support { background: rgba(90, 180, 255, 0.35); }
        .keyword-priority-detail { background: rgba(122, 212, 142, 0.35); }
        .dark-mode .keyword-priority-core { background: rgba(255, 209, 102, 0.24); }
        .dark-mode .keyword-priority-support { background: rgba(90, 180, 255, 0.16); }
        .dark-mode .keyword-priority-detail { background: rgba(122, 212, 142, 0.16); }
        .priority-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.7px;
            padding: 3px 7px;
            border-radius: 999px;
            margin-right: 6px;
            margin-bottom: 6px;
            vertical-align: middle;
        }
        .badge-core { background: rgba(255, 209, 102, 0.7); color: #563d00; }
        .badge-support { background: rgba(90, 180, 255, 0.5); color: #083b5d; }
        .badge-detail { background: rgba(122, 212, 142, 0.5); color: #0d4c2d; }
        .dark-mode .badge-core { color: #ffe9a8; }
        .dark-mode .badge-support { color: #dfeeff; }
        .dark-mode .badge-detail { color: #dafce8; }
        .answer-block {
            display: block;
            margin: 8px 0;
            padding: 8px 10px;
            border-left: 4px solid var(--accent);
            background: rgba(22, 125, 127, 0.05);
            border-radius: 6px;
        }
        .dark-mode .answer-block {
            background: rgba(85, 194, 181, 0.08);
        }
        .missing-word {
            color: red; font-weight: bold; text-decoration: underline; }
        .dark-mode .missing-word { color: #ff6b6b; }
        .keyword-hit {
            background: rgba(39, 174, 96, 0.18);
            color: inherit;
            border-radius: 4px;
            padding: 1px 4px;
            font-weight: 700;
        }
        .dark-mode .keyword-hit {
            background: rgba(39, 174, 96, 0.28);
            color: #dfffe9;
        }
        @media (max-width: 600px) {
            body { padding: 12px; }
            .container { padding: 22px 18px; border-radius: 10px; }
            .header-flex { align-items: flex-start; gap: 12px; }
            .header-flex > div { text-align: right; }
            #theme-toggle { font-size: 12px; padding: 6px 8px; }
            .home-link { display: block; margin-bottom: 8px; }
            button { margin-right: 5px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-flex">
            <div>
                <h1>Ôn tập Tự luận</h1>
                <p class="subtitle">Nhớ sâu hơn, trả lời tự tin hơn</p>
            </div>
            <div>
                <a class="home-link" href="index.html">Về trang chủ</a>
                <button id="theme-toggle" onclick="toggleTheme()">🌙 Chế độ ban đêm</button>
            </div>
        </div>
        <div id="quiz-container">
            <select id="subject-select" onchange="filterBySubject()">
                <option value="all">Tất cả các môn</option>
            </select>
            <span id="shuffle-notification">Đã xáo trộn câu hỏi!</span>

            <div class="memory-panel">
                <strong>Trợ lý ghi nhớ</strong>
                <div class="memory-stats">
                    <span>Cần ôn: <strong id="due-count">0</strong></span>
                    <span>Đã nhớ: <strong id="mastered-count">0</strong></span>
                    <span>Đã đánh giá: <strong id="reviewed-count">0</strong></span>
                </div>
                <div class="memory-actions">
                    <button class="btn-shuffle" onclick="startDueReview()">Ôn kiến thức cần nhớ</button>
                    <button class="btn-secondary" onclick="resetMemory()">Xóa lịch ghi nhớ</button>
                </div>
                <p class="memory-tip">Tự trả lời trước khi xem đáp án, sau đó chọn mức độ nhớ để lịch ôn được điều chỉnh.</p>
            </div>

            <div class="question-label">Câu hỏi hiện tại</div>
            <h2 id="question">Đang tải câu hỏi...</h2>
            <textarea id="answer-input" placeholder="Nhập câu trả lời của bạn vào đây..."></textarea>
            <br>
            <button onclick="checkAnswer()">Kiểm tra</button>
            <button id="toggle-answer-btn" class="btn-secondary" onclick="toggleAnswer()">Xem đáp án gốc</button>
            <button class="btn-secondary" onclick="toggleKeywordHighlight()">Bật/Tắt highlight</button>
            <button class="btn-secondary" onclick="toggleGroupedHighlight()">Highlight theo nhóm</button>
            <button class="btn-secondary" onclick="togglePriorityHighlight()">Highlight theo mức độ</button>
            <button class="btn-secondary" onclick="toggleMemoryHighlight()">Highlight theo độ nhớ</button>
            <button class="btn-secondary" onclick="toggleFocusMode()">Chế độ tập trung</button>
            <button class="btn-secondary" onclick="toggleRecallOnlyMode()">Chế độ nhớ trước</button>
            <button class="btn-secondary" onclick="toggleTypingFocusMode()">Không highlight khi gõ</button>
            <button class="btn-secondary" onclick="nextQuestion()">Câu tiếp theo</button>
            <button class="btn-shuffle" onclick="shuffleQuestions()">🔀 Xáo trộn câu hỏi</button>
            
            <div id="feedback"></div>
            <div id="original-answer"></div>
            <div id="recall-panel">
                <p>Bạn nhớ câu này đến mức nào?</p>
                <button class="btn-forgot" onclick="rateRecall('forgot')">Quên</button>
                <button class="btn-hard" onclick="rateRecall('hard')">Khó nhớ</button>
                <button class="btn-remembered" onclick="rateRecall('remembered')">Nhớ rồi</button>
            </div>
        </div>
    </div>

    <script>
        let allQuestions = [];
        let filteredQuestions = [];
        let currentIndex = 0;
        let isDueReview = false;
        let highlightEnabled = true;
        let groupedHighlightMode = false;
        let priorityHighlightMode = false;
        let memoryHighlightMode = false;
        let focusMode = false;
        let recallOnlyMode = false;
        let typingFocusMode = false;
        const memoryKey = 'dangs-mode-memory-v1';
        let memory = JSON.parse(localStorage.getItem(memoryKey) || '{}');
        const synonymMap = {
            'power efficiency': ['energy efficiency', 'energy efficient', 'efficient use of power'],
            'construction costs': ['construction cost', 'high cost', 'expensive construction'],
            'manufacturing difficulty': ['difficult to manufacture', 'hard to manufacture', 'manufacturing complexity'],
            'fragility': ['fragile', 'physical weakness'],
            'damage': ['damaged', 'harm'],
            'curved circuits': ['curved circuit', 'bent circuits'],
            'modulates': ['modulate', 'controls', 'changes', 'adjusts'],
            'two dimensional': ['2d'],
            'learn patterns': ['identify patterns', 'find patterns', 'recognize patterns'],
            'complex features automatically': ['automatic feature extraction', 'automatically learn features'],
            'generalize': ['generalise', 'work on new data'],
            'non linearity': ['nonlinearity', 'nonlinear'],
            'complex relationships': ['complex patterns', 'complicated relationships'],
            'vanishing gradients': ['gradient vanishing', 'gradients vanish'],
            'zero centered': ['centered around zero'],
            'fewer parameters': ['less parameters', 'reduced parameters'],
            'spatial information': ['information about position', 'position information'],
            'reduces the size': ['shrinks the size', 'makes smaller', 'downsamples'],
            'long-term dependencies': ['long term dependencies', 'long-range dependencies'],
            'remembered or forgotten': ['keep or discard', 'remember or forget'],
            'without interference': ['no interference']
        };

        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                allQuestions = data;
                filteredQuestions = [...allQuestions];
                populateSubjects();
                updateMemoryStats();
                loadQuestion();
            });

        function populateSubjects() {
            const select = document.getElementById('subject-select');
            const subjects = [...new Set(allQuestions.map(q => q.subject))];
            
            subjects.forEach(subject => {
                const option = document.createElement('option');
                option.value = subject;
                option.innerText = subject;
                select.appendChild(option);
            });
        }

        function filterBySubject() {
            const selectedSubject = document.getElementById('subject-select').value;
            if (selectedSubject === 'all') {
                filteredQuestions = [...allQuestions];
            } else {
                filteredQuestions = allQuestions.filter(q => q.subject === selectedSubject);
            }
            currentIndex = 0;
            isDueReview = false;
            loadQuestion();
        }

        function shuffleQuestions() {
            // Thuật toán xáo trộn mảng (Fisher-Yates)
            for (let i = filteredQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [filteredQuestions[i], filteredQuestions[j]] = [filteredQuestions[j], filteredQuestions[i]];
            }
            currentIndex = 0;
            isDueReview = false;
            loadQuestion();
            
            // Hiển thị thông báo nhỏ
            const notif = document.getElementById('shuffle-notification');
            notif.style.display = 'inline';
            setTimeout(() => { notif.style.display = 'none'; }, 2000);
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeRegExp(text) {
            return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function getMemoryModeClass(question) {
            const id = questionId(question);
            const entry = memory[id];
            if (!entry) return 'keyword-priority-core';
            if (entry.level >= 3) return 'keyword-priority-detail';
            if (entry.level === 2) return 'keyword-priority-support';
            return 'keyword-priority-core';
        }

        function renderPriorityLegend() {
            return [
                '<span class="priority-badge badge-core">CORE</span>',
                '<span class="priority-badge badge-support">SUPPORT</span>',
                '<span class="priority-badge badge-detail">DETAIL</span>'
            ].join('');
        }

        function shouldHideHighlightsForTyping() {
            return typingFocusMode && document.getElementById('answer-input').value.trim().length > 0;
        }

        function renderHighlightedText(text, keywords) {
            if (!highlightEnabled) return escapeHtml(text);
            if (shouldHideHighlightsForTyping()) return escapeHtml(text);
            const uniqueKeywords = [...new Set((keywords || []).map(k => String(k).trim()).filter(Boolean))]
                .sort((a, b) => b.length - a.length);

            let html = escapeHtml(text);
            if (focusMode) {
                const focusKeywords = uniqueKeywords.slice(0, Math.min(3, uniqueKeywords.length));
                focusKeywords.forEach(keyword => {
                    const pattern = escapeRegExp(keyword);
                    const regex = new RegExp(`(${pattern})`, 'gi');
                    html = html.replace(regex, '<mark class="keyword-priority-core">$1</mark>');
                });
                return html;
            }
            if (recallOnlyMode) {
                return escapeHtml(text);
            }
            if (typingFocusMode) {
                return escapeHtml(text);
            }

            if (memoryHighlightMode) {
                const currentQ = filteredQuestions[currentIndex];
                const colorClass = currentQ ? getMemoryModeClass(currentQ) : 'keyword-priority-core';
                uniqueKeywords.forEach(keyword => {
                    const pattern = escapeRegExp(keyword);
                    const regex = new RegExp(`(${pattern})`, 'gi');
                    html = html.replace(regex, `<mark class="${colorClass}">$1</mark>`);
                });
                return html;
            }

            if (priorityHighlightMode) {
                uniqueKeywords.forEach((keyword, index) => {
                    const levelClass = index % 3 === 0
                        ? 'keyword-priority-core'
                        : index % 3 === 1
                            ? 'keyword-priority-support'
                            : 'keyword-priority-detail';
                    const pattern = escapeRegExp(keyword);
                    const regex = new RegExp(`(${pattern})`, 'gi');
                    html = html.replace(regex, `<mark class="${levelClass}">$1</mark>`);
                });
                return html;
            }

            if (groupedHighlightMode) {
                uniqueKeywords.forEach((keyword, index) => {
                    const colorClass = `keyword-hl-${((index % 6) + 1)}`;
                    const pattern = escapeRegExp(keyword);
                    const regex = new RegExp(`(${pattern})`, 'gi');
                    html = html.replace(regex, `<mark class="${colorClass}">$1</mark>`);
                });
                return html;
            }

            uniqueKeywords.forEach(keyword => {
                const pattern = escapeRegExp(keyword);
                const regex = new RegExp(`(${pattern})`, 'gi');
                html = html.replace(regex, '<mark>$1</mark>');
            });
            return html;
        }

        function renderQuestionWithHighlights() {
            const currentQ = filteredQuestions[currentIndex];
            if (!currentQ) return;
            const questionText = `(Câu ${currentIndex + 1}/${filteredQuestions.length}) ${currentQ.question}`;
            const baseHtml = renderHighlightedText(questionText, currentQ.keywords);
            document.getElementById('question').innerHTML = `${renderPriorityLegend()}<br>${baseHtml}`;
        }

        function loadQuestion() {
            if(filteredQuestions.length === 0) return;
            renderQuestionWithHighlights();
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').addEventListener('input', function() {
                renderQuestionWithHighlights();
                const currentQ = filteredQuestions[currentIndex];
                const ansDiv = document.getElementById('original-answer');
                if (ansDiv.style.display !== 'none' && currentQ) {
                    const answerText = `${currentQ.original_answer}\n\nTừ khóa cần có: ${currentQ.keywords.join(', ')}`;
                    const answerBlocks = answerText
                        .split(/\n\n+/)
                        .map((block) => `<span class="answer-block">${renderHighlightedText(block, currentQ.keywords)}</span>`)
                        .join('');
                    ansDiv.innerHTML = `Đáp án gốc:<br>${answerBlocks}`;
                }
            });
            document.getElementById('feedback').style.display = 'none';
            const recallPanel = document.getElementById('recall-panel');
            recallPanel.innerHTML = '<p>Bạn nhớ câu này đến mức nào?</p>' +
                '<button class="btn-forgot" onclick="rateRecall(\'forgot\')">Quên</button>' +
                '<button class="btn-hard" onclick="rateRecall(\'hard\')">Khó nhớ</button>' +
                '<button class="btn-remembered" onclick="rateRecall(\'remembered\')">Nhớ rồi</button>';
            recallPanel.style.display = 'none';
            
            const ansDiv = document.getElementById('original-answer');
            const toggleBtn = document.getElementById('toggle-answer-btn');
            ansDiv.style.display = 'none';
            toggleBtn.innerText = 'Xem đáp án gốc';
        }

        function checkAnswer() {
            const userAnswer = normalizeText(document.getElementById('answer-input').value);
            const currentQ = filteredQuestions[currentIndex];
            let matchCount = 0;
            let missingKeywords = [];
            let matchedKeywords = [];

            currentQ.keywords.forEach(keyword => {
                if (matchesKeyword(userAnswer, keyword)) {
                    matchCount++;
                    matchedKeywords.push(keyword);
                } else {
                    missingKeywords.push(keyword);
                }
            });

            const matchPercentage = (matchCount / currentQ.keywords.length) * 100;
            const feedbackDiv = document.getElementById('feedback');
            feedbackDiv.style.display = 'block';
            document.getElementById('recall-panel').style.display = 'block';

            if (matchPercentage >= 70) {
                feedbackDiv.className = 'correct';
                const matchedHighlighted = matchedKeywords.map(kw => `<span class="keyword-hit">${escapeHtml(kw)}</span>`).join(', ');
                feedbackDiv.innerHTML = `<strong>Chính xác!</strong> Bạn đã trúng ${matchCount}/${currentQ.keywords.length} từ khóa quan trọng.<br>Những ý bạn đã nêu: ${matchedHighlighted}`;
            } else {
                feedbackDiv.className = 'incorrect';
                let missingHTML = missingKeywords.map(kw => `<span class="missing-word">${escapeHtml(kw)}</span>`).join(", ");
                feedbackDiv.innerHTML = `<strong>Chưa đủ ý!</strong> Bạn trúng ${matchCount}/${currentQ.keywords.length} từ khóa.<br>Bạn đang thiếu hoặc gõ sai các ý trọng tâm sau: ${missingHTML}`;
            }
        }

        function normalizeText(text) {
            return text.toLowerCase()
                .replace(/[^a-z0-9\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function matchesKeyword(answer, keyword) {
            const normalizedKeyword = normalizeText(keyword);
            const variants = [normalizedKeyword].concat(synonymMap[normalizedKeyword] || []);
            return variants.some(variant => answer.includes(normalizeText(variant))) ||
                variants.some(variant => fuzzyPhraseMatch(answer, normalizeText(variant)));
        }

        function fuzzyPhraseMatch(answer, phrase) {
            const phraseWords = phrase.split(' ');
            if (phraseWords.length > 2) return false;
            return phraseWords.every(word => answer.split(' ').some(answerWord =>
                word.length > 4 && editDistance(word, answerWord) <= 1));
        }

        function editDistance(first, second) {
            const distances = Array.from({ length: second.length + 1 }, (_, index) => index);
            for (let row = 1; row <= first.length; row++) {
                let diagonal = distances[0];
                distances[0] = row;
                for (let column = 1; column <= second.length; column++) {
                    const above = distances[column];
                    distances[column] = first[row - 1] === second[column - 1]
                        ? diagonal
                        : Math.min(diagonal + 1, distances[column] + 1, distances[column - 1] + 1);
                    diagonal = above;
                }
            }
            return distances[second.length];
        }

        function toggleAnswer() {
            const ansDiv = document.getElementById('original-answer');
            const toggleBtn = document.getElementById('toggle-answer-btn');
            const currentQ = filteredQuestions[currentIndex];
            
            if (ansDiv.style.display === 'none' || ansDiv.style.display === '') {
                const answerText = `${currentQ.original_answer}\n\nTừ khóa cần có: ${currentQ.keywords.join(', ')}`;
                const answerBlocks = answerText
                    .split(/\n\n+/)
                    .map((block) => `<span class="answer-block">${renderHighlightedText(block, currentQ.keywords)}</span>`)
                    .join('');
                ansDiv.innerHTML = `Đáp án gốc:<br>${answerBlocks}`;
                ansDiv.style.display = 'block';
                toggleBtn.innerText = 'Thu đáp án lại';
            } else {
                ansDiv.style.display = 'none';
                toggleBtn.innerText = 'Xem đáp án gốc';
            }
        }

        function nextQuestion() {
            currentIndex = (currentIndex + 1) % filteredQuestions.length;
            loadQuestion();
        }

        function questionId(question) {
            return question.subject + '::' + question.question;
        }

        function updateMemoryStats() {
            const now = Date.now();
            const entries = Object.values(memory);
            document.getElementById('due-count').innerText = entries.filter(item => item.dueAt <= now).length;
            document.getElementById('mastered-count').innerText = entries.filter(item => item.level >= 3).length;
            document.getElementById('reviewed-count').innerText = entries.length;
        }

        function rateRecall(rating) {
            const currentQ = filteredQuestions[currentIndex];
            const id = questionId(currentQ);
            const previous = memory[id] || { level: 0 };
            const intervals = { forgot: 0, hard: 1, remembered: 3 };
            const nextLevel = rating === 'forgot' ? 0 : Math.min(previous.level + 1, 3);
            const intervalDays = rating === 'remembered' ? [0, 1, 3, 7][nextLevel] : intervals[rating];
            memory[id] = {
                level: nextLevel,
                dueAt: Date.now() + intervalDays * 24 * 60 * 60 * 1000,
                lastRating: rating
            };
            localStorage.setItem(memoryKey, JSON.stringify(memory));
            updateMemoryStats();
            document.getElementById('recall-panel').innerHTML = '<p>Đã lưu. Lần ôn tiếp theo: ' + (intervalDays === 0 ? 'ngay sau khi hết lượt' : 'sau ' + intervalDays + ' ngày') + '.</p>';
        }

        function startDueReview() {
            const now = Date.now();
            const dueIds = new Set(Object.keys(memory).filter(id => memory[id].dueAt <= now));
            const dueQuestions = allQuestions.filter(question => dueIds.has(questionId(question)));
            if (dueQuestions.length === 0) {
                showShuffleNotification('Chưa có câu nào đến hạn ôn!');
                return;
            }
            filteredQuestions = dueQuestions;
            currentIndex = 0;
            isDueReview = true;
            loadQuestion();
            showShuffleNotification('Đang ôn ' + dueQuestions.length + ' câu đến hạn.');
        }

        function resetMemory() {
            if (!confirm('Xóa toàn bộ lịch ghi nhớ của Dang\'s mode?')) return;
            memory = {};
            localStorage.removeItem(memoryKey);
            updateMemoryStats();
            showShuffleNotification('Đã xóa lịch ghi nhớ.');
        }

        function showShuffleNotification(message) {
            const notif = document.getElementById('shuffle-notification');
            notif.innerText = message;
            notif.style.display = 'inline';
            setTimeout(() => { notif.style.display = 'none'; }, 2500);
        }

        }
